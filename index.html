<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
    <title>实时音高监测器 Pro</title>
    <style>
        :root {
            --bg-color: #0A0A0C;
            --card-bg: rgba(28, 28, 30, 0.7);
            --text-primary: #ffffff;
            --text-secondary: #8e8e93;
            --border-color: rgba(255, 255, 255, 0.08);

            /* 低饱和度区间背景色 (莫兰迪色系 柔和不刺眼) */
            --zone-red-bg: rgba(214, 97, 97, 0.15);
            --zone-yellow-bg: rgba(224, 194, 79, 0.15);
            --zone-green-bg: rgba(82, 183, 106, 0.25);

            /* 对应区间的高级感激活色 */
            --pitch-red: #D66161;
            --pitch-yellow: #E0C24F;
            --pitch-green: #52B76A;
        }

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            -webkit-tap-highlight-color: transparent;
        }

        body {
            font-family: -apple-system, BlinkMacSystemFont, "SF Pro Text", "SF Pro Display", "Helvetica Neue", Arial, sans-serif;
            background-color: var(--bg-color);
            color: var(--text-primary);
            min-height: 100vh;
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            overflow: hidden;
            padding: 20px;
        }

        .tuner-container {
            width: 100%;
            max-width: 380px;
            background: var(--card-bg);
            backdrop-filter: blur(30px);
            -webkit-backdrop-filter: blur(30px);
            border: 1px solid var(--border-color);
            border-radius: 32px;
            padding: 40px 24px;
            text-align: center;
            box-shadow: 0 30px 60px rgba(0, 0, 0, 0.4);
        }

        .header h1 {
            font-size: 19px;
            font-weight: 600;
            letter-spacing: -0.3px;
        }

        .header p {
            font-size: 13px;
            color: var(--text-secondary);
            margin-top: 6px;
        }

        .status-dot {
            display: inline-block;
            width: 7px;
            height: 7px;
            background-color: var(--pitch-red);
            border-radius: 50%;
            margin-right: 6px;
            vertical-align: middle;
            transition: all 0.3s;
        }

        .status-dot.active {
            background-color: var(--pitch-green);
            box-shadow: 0 0 10px var(--pitch-green);
        }

        .pitch-display {
            margin: 35px 0;
            height: 110px;
            display: flex;
            flex-direction: column;
            justify-content: center;
        }

        .note-name {
            font-size: 76px;
            font-weight: 700;
            letter-spacing: -2px;
            line-height: 1;
            background: linear-gradient(180deg, #ffffff 0%, #b3b3b7 100%);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            opacity: 0.4;
            transition: opacity 0.2s ease, filter 0.2s ease;
        }

        .frequency {
            font-size: 16px;
            font-weight: 400;
            color: var(--text-secondary);
            margin-top: 12px;
            font-variant-numeric: tabular-nums;
        }

        /* 三段式色块刻度条结构 */
        .meter-container {
            width: 100%;
            margin: 35px 0 20px 0;
            position: relative;
        }

        .meter-bar {
            width: 100%;
            height: 6px;
            border-radius: 3px;
            position: relative;
            background: linear-gradient(to right, 
                var(--zone-red-bg) 0%, var(--zone-red-bg) 30%, 
                var(--zone-yellow-bg) 30%, var(--zone-yellow-bg) 45%, 
                var(--zone-green-bg) 45%, var(--zone-green-bg) 55%, 
                var(--zone-yellow-bg) 55%, var(--zone-yellow-bg) 70%, 
                var(--zone-red-bg) 70%, var(--zone-red-bg) 100%
            );
            overflow: visible;
        }

        /* 极简刻度中心线 */
        .meter-center {
            width: 2px;
            height: 12px;
            background: rgba(255, 255, 255, 0.25);
            position: absolute;
            top: -3px;
            left: 50%;
            transform: translateX(-50%);
            z-index: 1;
        }

        /* 拟物化悬浮指针 */
        .meter-pointer {
            width: 4px;
            height: 22px;
            background: #444446;
            position: absolute;
            top: -8px;
            left: 50%;
            transform: translateX(-50%);
            border-radius: 2px;
            z-index: 2;
            transition: left 0.08s cubic-bezier(0.1, 0.8, 0.3, 1);
        }

        .meter-labels {
            display: flex;
            justify-content: space-between;
            font-size: 11px;
            color: var(--text-secondary);
            margin-top: 14px;
            padding: 0 2px;
            letter-spacing: 0.3px;
        }

        .action-btn {
            width: 100%;
            padding: 16px;
            background: #ffffff;
            color: #000000;
            border: none;
            border-radius: 16px;
            font-size: 16px;
            font-weight: 600;
            cursor: pointer;
            transition: all 0.25s cubic-bezier(0.16, 1, 0.3, 1);
            margin-top: 15px;
        }

        .action-btn:active {
            transform: scale(0.96);
            background: rgba(255, 255, 255, 0.9);
        }

        .action-btn.listening {
            background: rgba(255, 255, 255, 0.1);
            color: var(--text-primary);
            border: 1px solid var(--border-color);
        }
    </style>
</head>
<body>

    <div class="tuner-container">
        <div class="header">
            <h1><span class="status-dot" id="statusDot"></span>实时音高检测</h1>
            <p id="statusText">请使用 Safari 浏览器并在 HTTPS 环境下运行</p>
        </div>

        <div class="pitch-display">
            <div class="note-name" id="noteTxt">--</div>
            <div class="frequency" id="freqTxt">0.0 Hz</div>
        </div>

        <div class="meter-container">
            <div class="meter-center"></div>
            <div class="meter-bar">
                <div class="meter-pointer" id="meterPointer"></div>
            </div>
            <div class="meter-labels">
                <span style="color: var(--pitch-red)">偏低</span>
                <span style="color: var(--pitch-green)">完美</span>
                <span style="color: var(--pitch-red)">偏高</span>
            </div>
        </div>

        <button class="action-btn" id="actionBtn">开启麦克风</button>
    </div>

    <script>
        let audioContext = null;
        let analyser = null;
        let mediaStream = null;
        let isListening = false;
        let animationId = null;
        
        const buflen = 2048;
        const buf = new Float32Array(buflen);
        const noteStrings = ["C", "C#", "D", "D#", "E", "F", "F#", "G", "G#", "A", "A#", "B"];

        const actionBtn = document.getElementById('actionBtn');
        const statusDot = document.getElementById('statusDot');
        const statusText = document.getElementById('statusText');
        const noteTxt = document.getElementById('noteTxt');
        const freqTxt = document.getElementById('freqTxt');
        const meterPointer = document.getElementById('meterPointer');

        actionBtn.addEventListener('click', toggleListening);

        async function toggleListening() {
            if (isListening) {
                stopAudio();
            } else {
                try {
                    // 1. 初始化并前置激活 AudioContext（适配 iOS 必须在点击事件内部 running）
                    audioContext = new (window.AudioContext || window.webkitAudioContext)();
                    if (audioContext.state === 'suspended') {
                        await audioContext.resume();
                    }
                    
                    // 2. 双层降级获取麦克风流（解决因高级参数导致的硬件拒绝问题）
                    try {
                        mediaStream = await navigator.mediaDevices.getUserMedia({
                            audio: {
                                echoCancellation: false,
                                noiseSuppression: false,
                                autoGainControl: false
                            }
                        });
                    } catch (constraintErr) {
                        console.warn("严格音频约束受阻，正在尝试降级兼容模式...", constraintErr);
                        // 降级为最基础的音频流请求，iOS 100% 支持
                        mediaStream = await navigator.mediaDevices.getUserMedia({ audio: true });
                    }

                    const source = audioContext.createMediaStreamSource(mediaStream);
                    analyser = audioContext.createAnalyser();
                    analyser.fftSize = buflen;
                    source.connect(analyser);

                    isListening = true;
                    actionBtn.textContent = "停止检测";
                    actionBtn.classList.add('listening');
                    statusDot.classList.add('active');
                    statusText.textContent = "正在实时聆听...";

                    updatePitch();
                } catch (err) {
                    console.error("麦克风激活失败详情:", err);
                    
                    // 精准判定错误原因，防止盲目排查
                    let errorAlert = "无法获取麦克风。请确保使用原生 Safari 浏览器。";
                    if (err.name === 'NotAllowedError' || err.name === 'PermissionDeniedError') {
                        errorAlert = "您拒绝了麦克风权限。\n请点击地址栏左侧的『AA』或进入系统设置放行 Safari 的麦克风权限。";
                    } else {
                        errorAlert += `\n(系统错误码: ${err.name})`;
                    }
                    
                    alert(errorAlert);
                    statusText.textContent = `未获得权限 (${err.name})`;
                }
            }
        }

        function stopAudio() {
            isListening = false;
            if (animationId) cancelAnimationFrame(animationId);
            if (mediaStream) mediaStream.getTracks().forEach(track => track.stop());
            if (audioContext) audioContext.close();

            actionBtn.textContent = "开启麦克风";
            actionBtn.classList.remove('listening');
            statusDot.classList.remove('active');
            statusText.textContent = "点击下方按钮开始";
            noteTxt.textContent = "--";
            noteTxt.style.opacity = "0.4";
            noteTxt.style.background = "linear-gradient(180deg, #ffffff 0%, #b3b3b7 100%)";
            noteTxt.style.webkitBackgroundClip = "text";
            freqTxt.textContent = "0.0 Hz";
            meterPointer.style.left = "50%";
            meterPointer.style.backgroundColor = "#444446";
            meterPointer.style.boxShadow = "none";
        }

        // 自相关基频分析
        function autoCorrelate(buffer, sampleRate) {
            let SIZE = buffer.length;
            let rms = 0;

            for (let i = 0; i < SIZE; i++) {
                let val = buffer[i];
                rms += val * val;
            }
            rms = Math.sqrt(rms / SIZE);
            if (rms < 0.015) return -1; // 过滤环境低噪

            let r1 = 0, r2 = SIZE - 1;
            let thres = 0.2;
            for (let i = 0; i < SIZE / 2; i++) {
                if (Math.abs(buffer[i]) < thres) { r1 = i; break; }
            }
            for (let i = SIZE - 1; i >= SIZE / 2; i--) {
                if (Math.abs(buffer[i]) < thres) { r2 = i; break; }
            }

            let b = buffer.slice(r1, r2);
            SIZE = b.length;

            let c = new Float32Array(SIZE);
            for (let i = 0; i < SIZE; i++) {
                for (let j = 0; j < SIZE - i; j++) {
                    c[i] = c[i] + b[j] * b[j + i];
                }
            }

            let d = 0;
            while (c[d] > c[d + 1]) d++;
            let maxval = -1, maxpos = -1;
            for (let i = d; i < SIZE / 2; i++) {
                if (c[i] > maxval) {
                    maxval = c[i];
                    maxpos = i;
                }
            }
            
            let T0 = maxpos;
            let x1 = c[T0 - 1], x2 = c[T0], x3 = c[T0 + 1];
            let a = (x1 + x3 - 2 * x2) / 2;
            let b_val = (x3 - x1) / 2;
            if (a) T0 = T0 - b_val / (2 * a);

            return sampleRate / T0;
        }

        function updatePitch() {
            if (!isListening) return;

            analyser.getFloat32TimeDomainData(buf);
            const pitch = autoCorrelate(buf, audioContext.sampleRate);

            if (pitch === -1) {
                noteTxt.style.opacity = "0.4";
            } else {
                noteTxt.style.opacity = "1";
                const frequency = pitch;
                
                const noteNum = 12 * (Math.log(frequency / 440) / Math.log(2)) + 69;
                const roundedNoteNum = Math.round(noteNum);
                const noteName = noteStrings[roundedNoteNum % 12];
                const octave = Math.floor(roundedNoteNum / 12) - 1;

                const expectedHz = 440 * Math.pow(2, (roundedNoteNum - 69) / 12);
                const cents = Math.floor(1200 * Math.log(frequency / expectedHz) / Math.log(2));

                noteTxt.textContent = noteName + octave;
                freqTxt.textContent = frequency.toFixed(1) + " Hz";

                let pointerPercent = 50 + cents; 
                pointerPercent = Math.max(2, Math.min(98, pointerPercent));
                meterPointer.style.left = `${pointerPercent}%`;

                const absCents = Math.abs(cents);
                let activeColor = 'var(--pitch-red)';
                let glowColor = 'rgba(214, 97, 97, 0.35)';

                // 动态视觉反馈：根据音准区间切换高质感色彩
                if (absCents <= 5) {
                    activeColor = 'var(--pitch-green)';
                    glowColor = 'rgba(82, 183, 106, 0.5)';
                    // 完美音准时，字体也透出细腻的呼吸绿
                    noteTxt.style.background = "linear-gradient(180deg, #ffffff 30%, var(--pitch-green) 100%)";
                    noteTxt.style.webkitBackgroundClip = "text";
                } else if (absCents <= 20) {
                    activeColor = 'var(--pitch-yellow)';
                    glowColor = 'rgba(224, 194, 79, 0.4)';
                    noteTxt.style.background = "linear-gradient(180deg, #ffffff 40%, var(--pitch-yellow) 100%)";
                    noteTxt.style.webkitBackgroundClip = "text";
                } else {
                    noteTxt.style.background = "linear-gradient(180deg, #ffffff 0%, #b3b3b7 100%)";
                    noteTxt.style.webkitBackgroundClip = "text";
                }

                meterPointer.style.backgroundColor = activeColor;
                meterPointer.style.boxShadow = `0 0 10px ${glowColor}`;
            }

            animationId = requestAnimationFrame(updatePitch);
        }
    </script>
</body>
</html>
